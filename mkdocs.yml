site_name: Facepunch S&box API Unofficial Documentation
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.top
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - English API:
      - Search: en/search.md
      - Packages: en/package.md
      - Package Versions: en/versions.md
      - Reviews: en/reviews.md
      - Stats: en/stats.md
      - Leaderboards: en/leaderboard.md
      - Achievements: en/achievements.md
      - Players: en/players.md
      - News: en/news.md
      - Utility: en/utility.md
  - API Français:
      - Recherche: fr/search.md
      - Packages: fr/package.md
      - Versions de Package: fr/versions.md
      - Avis: fr/reviews.md
      - Statistiques: fr/stats.md
      - Classements: fr/leaderboard.md
      - Succès: fr/achievements.md
      - Joueurs: fr/players.md
      - News: fr/news.md
      - Utilitaires: fr/utility.md


repo_url: https://github.com/smallboxstudio/unofficial-docs-facepunch
repo_name: smallboxstudio/unofficial-docs-facepunch